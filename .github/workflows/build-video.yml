name: Build video assets
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Video source (auto prefers the storyboard PNG)"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - png
          - svg
  push:
    paths:
      - '01-mixue/**'
      - '.github/workflows/build-video.yml'
permissions:
  contents: read
jobs:
  build-mixue:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies and browser
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r 01-mixue/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Generate Japanese TTS
        run: python 01-mixue/make-tts.py
      - name: Route source and build MP4
        env:
          VIDEO_SOURCE: ${{ github.event.inputs.source || 'auto' }}
        run: python 01-mixue/build-video.py --source "$VIDEO_SOURCE" --fps 1 --duration 120
      - name: Upload build artifact (not YouTube)
        uses: actions/upload-artifact@v4
        with:
          name: 01-mixue-video
          path: |
            01-mixue/build/mixue.mp4
            01-mixue/build/narration.mp3
          if-no-files-found: error
          retention-days: 14
