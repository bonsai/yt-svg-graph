name: Build video assets

on:
  workflow_dispatch:
  push:
    paths:
      - '01-mixue/**'
      - '.github/workflows/build-video.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build 01-mixue
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '01-mixue/requirements.txt'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg plantuml

      - name: Install Python deps
        run: |
          pip install -r 01-mixue/requirements.txt
          # edge-tts, playwright, pillow, numpy

      - name: Install Playwright browsers
        run: playwright install chromium

      - name: Run TTS (generate audio + timing.json)
        working-directory: 01-mixue
        run: |
          python make-tts.py

      - name: Extract panels + QA (prepare-only)
        working-directory: 01-mixue
        run: |
          python png2mov.py --prepare-only

      - name: Verify mechanical QA
        working-directory: 01-mixue
        run: |
          python -c "
import json
with open('build/source/qa/panel-crop-qa.json') as f:
    qa = json.load(f)
print(f'Mechanical QA: {qa[\"overall\"]}  pass={qa[\"summary\"][\"pass\"]} review={qa[\"summary\"][\"review\"]} fail={qa[\"summary\"][\"fail\"]}')
if qa['overall'] == 'fail':
    exit(1)
"

      - name: Generate PlantUML diagram
        working-directory: 01-mixue
        run: |
          plantuml -tsvg pipeline.puml -o build/assets/diagrams

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mixue-video-assets
          path: |
            01-mixue/build/assets/**/*
            01-mixue/build/source/**/*
            01-mixue/build/tts/**/*
            01-mixue/build/panel/**/*
          retention-days: 7

      - name: Create release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: 01-mixue/build/assets/video/mixue.mp4
          generate_release_notes: true