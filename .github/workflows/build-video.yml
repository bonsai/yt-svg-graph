name: Build video assets
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Video source (auto prefers the storyboard PNG)"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - png
          - svg
  push:
    paths:
      - '01-mixue/**'
      - '.github/workflows/build-video.yml'
permissions:
  contents: read
jobs:
  build-mixue:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies and browser
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r 01-mixue/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Generate Japanese TTS
        run: python 01-mixue/make-tts.py
      - name: Prepare PNG panels for local VLM (or build SVG video)
        env:
          VIDEO_SOURCE: ${{ github.event.inputs.source || 'auto' }}
        run: |
          if [ "$VIDEO_SOURCE" = "png" ] || { [ "$VIDEO_SOURCE" = "auto" ] && [ -f "01-mixue/MIXUE世界展開ストーリーボード展開.png" ]; }; then
            python 01-mixue/build-video.py --source png --prepare-only
          else
            python 01-mixue/build-video.py --source svg --fps 1 --duration 120
          fi
      - name: Upload build artifact (not YouTube)
        uses: actions/upload-artifact@v4
        with:
          name: 01-mixue-video
          path: |
            01-mixue/build/
          if-no-files-found: error
          retention-days: 14
