<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>01 MIXUE — SVG video</title><style>*{box-sizing:border-box}body{margin:0;background:#10131b;color:#fff;font-family:system-ui,'Yu Gothic',sans-serif}.stage{width:min(100vw,177.777vh);aspect-ratio:16/9;margin:auto;position:relative;overflow:hidden;background:linear-gradient(135deg,#15253a,#10131b 65%);padding:6%}.eyebrow{color:#f5c542;font-weight:800;letter-spacing:.12em}.title{font-size:clamp(28px,5vw,76px);font-weight:900;line-height:1.15;max-width:90%;margin:2% 0}.sub{font-size:clamp(15px,2vw,28px);color:#cbd5e1}.chart{display:flex;align-items:end;gap:4%;height:42%;margin:4% 0 2%;border-bottom:2px solid #8190a8;padding:0 4%}.bar{width:22%;border-radius:12px 12px 0 0;background:#f5c542;position:relative;min-height:10%;transition:height 1s}.bar:nth-child(2){background:#e34b4b}.bar:nth-child(3){background:#8bc5ff}.bar span{position:absolute;bottom:100%;left:0;right:0;text-align:center;font-size:clamp(14px,2vw,28px);font-weight:800;padding-bottom:8px}.labels{display:flex;gap:4%;padding:8px 4%;font-size:clamp(12px,1.5vw,22px)}.labels span{width:22%;text-align:center}.note{position:absolute;bottom:4%;left:6%;right:6%;color:#aab5c7;font-size:clamp(10px,1vw,15px)}.big{font-size:clamp(40px,8vw,112px);font-weight:900;color:#f5c542}.snow{font-size:clamp(70px,13vw,170px);float:right;filter:drop-shadow(0 10px 20px #0008)}.timeline{position:absolute;bottom:0;left:0;height:6px;background:#f5c542;width:0} .controls{max-width:960px;margin:12px auto;padding:0 12px;display:flex;gap:8px;align-items:center}.controls button{padding:8px 12px;cursor:pointer}#caption{max-width:960px;margin:12px auto;padding:0 12px;line-height:1.8;color:#dce3ef}</style></head><body><main class="stage" id="stage"><div class="eyebrow" id="eyebrow">01 · MIXUE / ORIGIN STORY</div><div class="snow" id="snow">❄️</div><h1 class="title" id="title">スタバ・マック超え！？<br>小さな屋台から世界一へ</h1><p class="sub" id="sub">中国発の低価格ドリンクチェーン、MIXUEの成長物語</p><div id="chart" class="chart" hidden></div><div id="labels" class="labels" hidden></div><div class="big" id="big"></div><div class="note" id="note">※ 店舗数・価格は報道時点等が異なる概数・参考例です。</div><div class="timeline" id="timeline"></div></main><div class="controls"><button id="play">▶ 再生</button><button id="restart">↺ 最初から</button><input id="scrub" type="range" min="0" max="120" value="0" style="flex:1"><span id="time">00:00</span></div><p id="caption"></p><script>
const scenes=[
{start:0,end:8,kicker:'01 / 店舗数',title:'スタバ・マック超え！？',sub:'世界に広がるMIXUEとは？',chart:[['MIXUE','64,000',100],['McDonald’s','44,000',69],['Starbucks','40,000',63]],note:'店舗数は2026年ごろの報道等をもとにした概数。集計時点・定義は同一ではありません。',caption:'スタバやマックより、店が多い飲食チェーン。知っていますか？ その正体は、中国発のMIXUEです。'},
{start:8,end:16,kicker:'02 / 価格',title:'この安さ、なぜ？',sub:'日常に寄り添う低価格',chart:[['台湾茶','¥100',20],['レモンティー','¥130',26],['カフェ参考例','¥500',100]],note:'記事掲載価格の例と一般的なカフェ価格の参考値。商品・地域・時期が異なり単純比較ではありません。',caption:'記事掲載価格では、台湾茶が100円、レモンティーが130円。いったい、どうしてこの価格が可能なのでしょうか。'},
{start:16,end:31,kicker:'03 / ORIGIN',title:'始まりは1997年',sub:'中国・河南省の小さなかき氷屋台',big:'一軒の屋台',caption:'物語の始まりは1997年、中国・河南省。創業者の張紅超が始めた小さなかき氷屋台が、MIXUEの原点とされています。最初から世界を目指す巨大企業だったわけではありません。'},
{start:31,end:47,kicker:'04 / PRODUCTS',title:'かき氷から、ドリンクへ',sub:'ソフトクリーム、茶、レモンティーへ',big:'安く、気軽に。',caption:'かき氷からソフトクリームへ。そしてお茶やレモンティーへ。商品を広げながら、誰もが気軽に楽しめる価格を追求しました。特別な日の一杯ではなく、日常に寄り添う一杯を目指したのです。'},
{start:47,end:65,kicker:'05 / SUPPLY CHAIN',title:'安さを支える仕組み',sub:'調達・加工・物流 ＋ フランチャイズ',big:'仕組みで安く',caption:'強みは安さだけではありません。原材料の調達から加工、物流までを効率化し、フランチャイズ方式で店舗を広げる。商品を安くするだけでなく、安く届け続ける仕組みをつくったのです。'},
{start:65,end:81,kicker:'06 / BRAND',title:'雪王が、ブランドになる',sub:'キャラクターとテーマソングがSNSで話題に',big:'❄️ 雪王',caption:'さらに、王冠をかぶった雪だるまのようなキャラクター「雪王」と、耳に残るテーマソングがSNSで話題に。商品だけでなく、ブランド自体が共有したくなるコンテンツになりました。'},
{start:81,end:101,kicker:'07 / JAPAN',title:'次は、日本で広がる？',sub:'価格だけでなく、味と体験も勝負',big:'日本市場に注目',caption:'MIXUEは世界規模へ成長し、日本にも進出しています。ただ、日本ではまだ店舗数は限られています。コンビニや自動販売機が身近な日本で、価格だけでなく、味や体験でも選ばれるのか。これからが注目です。'},
{start:101,end:120,kicker:'08 / THE NEXT CHAPTER',title:'小さな屋台から、世界へ。',sub:'MIXUEの次の成長ストーリーは？',big:'NEXT →',caption:'一軒の屋台から始まった商いが、世界へ。そして日本の街へ。これから店舗が増え、雪王の看板を見かける日常が来るかもしれません。大きな企業も、始まりは小さな一歩。MIXUEの次の成長ストーリーを見届けましょう。'}];
let t=0,playing=false,last=0,raf;const $=id=>document.getElementById(id);function fmt(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(Math.floor(n%60)).padStart(2,'0')}function render(){let s=scenes.find(x=>t>=x.start&&t<x.end)||scenes.at(-1);$('eyebrow').textContent=s.kicker;$('title').innerHTML=s.title;$('sub').textContent=s.sub;$('caption').textContent=s.caption;$('note').textContent=s.note||'MIXUEの成長をたどる、約2分のストーリー。';$('big').textContent=s.big||'';$('chart').hidden=!s.chart;$('labels').hidden=!s.chart;$('chart').innerHTML=s.chart?s.chart.map(x=>`<div class="bar" style="height:${x[2]}%"><span>${x[1]}</span></div>`).join(''):'';$('labels').innerHTML=s.chart?s.chart.map(x=>`<span>${x[0]}</span>`).join(''):'';$('snow').textContent=s.kicker.includes('BRAND')?'👑❄️':'❄️';$('timeline').style.width=(t/120*100)+'%';$('scrub').value=t;$('time').textContent=fmt(t)}function tick(now){if(playing){if(last)t+=(now-last)/1000;last=now;if(t>=120){t=120;playing=false;$('play').textContent='▶ 再生';last=0}render();raf=requestAnimationFrame(tick)}}$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'⏸ 一時停止':'▶ 再生';last=0;if(playing)raf=requestAnimationFrame(tick)};$('restart').onclick=()=>{t=0;render();if(playing){last=0}};$('scrub').oninput=e=>{t=+e.target.value;render()};render();
</script></body></html>
